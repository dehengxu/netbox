# See PEP 518 for the spec of this file
# https://www.python.org/dev/peps/pep-0518/

[tool.black]
line-length = 120
target_version = ['py310', 'py311', 'py312']
skip-string-normalization = true

[tool.isort]
profile = "black"

[tool.pylint]
max-line-length = 120

[tool.pyright]
include = ["netbox"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
reportMissingImports = true
reportMissingTypeStubs = false

[project]
name = "netbox"
version = "v4.2.9"
description = "A simple example project"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"  # 如果有 README 文件
license = { text = "MIT" }  # 根据你的项目许可证进行修改

[tool.setuptools.packages.find]
include = [ "account", "circuits", "core", "dcim", "extras", "ipam" , "media", "netbox", "reports", "scripts", "tenancy", "users", "utilities", "virtualization", "vpn", "wireless", "*.py"]
where = ["netbox"]
